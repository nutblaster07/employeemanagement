
server.port=${PORT:8081}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.h2.console.enabled=false

SENDGRID_API_KEY=${SENDGRID_API_KEY:}
SENDGRID_FROM_EMAIL=${SENDGRID_FROM_EMAIL:arooy723@gmail.com}
INACTIVE_NOTIFICATION_TO_EMAIL=${INACTIVE_NOTIFICATION_TO_EMAIL:arooy723@gmail.com}
